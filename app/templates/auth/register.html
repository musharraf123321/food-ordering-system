{% extends "base.html" %}
{% from "_macros.html" import csrf with context %}
{% block title %}Register{% endblock %}
{% block body_class %}auth-bg{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <div class="auth-card p-4 p-md-5">
      <div class="text-center mb-4">
        <div class="auth-brand">Food<span>Hub</span></div>
        <h2 class="h4 fw-bold mt-2 mb-1">Create your account</h2>
        <p class="text-muted mb-0">It only takes a minute</p>
      </div>
      <form method="post" novalidate>
        {{ csrf() }}
        <div class="row g-3">
          <div class="col-12"><label class="form-label fw-semibold">Full name *</label>
            <input type="text" name="name" class="form-control" value="{{ form.get('name','') }}" required></div>
          <div class="col-12"><label class="form-label fw-semibold">Email *</label>
            <input type="email" name="email" class="form-control" value="{{ form.get('email','') }}" required></div>
          <div class="col-md-6"><label class="form-label fw-semibold">Password *</label>
            <input type="password" name="password" class="form-control" minlength="6" required></div>
          <div class="col-md-6"><label class="form-label fw-semibold">Confirm password *</label>
            <input type="password" name="confirm_password" class="form-control" minlength="6" required></div>
          <div class="col-md-6"><label class="form-label fw-semibold">Phone</label>
            <input type="text" name="phone" class="form-control" value="{{ form.get('phone','') }}"></div>
          <div class="col-md-6"><label class="form-label fw-semibold">Register as</label>
            <select name="role" class="form-select">
              <option value="customer" {{ 'selected' if form.get('role')!='owner' }}>Customer</option>
              <option value="owner" {{ 'selected' if form.get('role')=='owner' }}>Restaurant Owner</option>
            </select></div>
          <div class="col-12"><label class="form-label fw-semibold">Delivery address</label>
            <input type="text" name="address" class="form-control" value="{{ form.get('address','') }}"></div>
        </div>
        <button class="btn btn-brand btn-lg w-100 mt-4"><i class="fa-solid fa-user-plus me-2"></i>Register</button>
      </form>
      <hr>
      <p class="text-center mb-0">Already registered? <a href="{{ url_for('auth.login') }}" class="fw-bold">Log in</a></p>
    </div>
  </div>
</div>
{% endblock %}
